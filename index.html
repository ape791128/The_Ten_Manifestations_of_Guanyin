<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦觀音祈福靈珠✦</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* 宇宙虛空與神聖金光色系 */
            --void-bg: #030308;
            --nebula-dark: #0f1026;
            --nebula-light: #1c1f4a;
            --divine-gold: #eedd99; /* 微調為較柔和的法帖金 */
            --divine-gold-glow: rgba(238, 221, 153, 0.6);
            --starlight: #e6f2ff;
            --glass-bg: rgba(15, 16, 38, 0.5);
            --glass-border: rgba(255, 215, 0, 0.2);
            --text-main: #fdfbf7;
            --text-muted: #8e8b99;
            --blue-accent: #64b5f6; /* 新增附圖中的冰藍色點綴 */
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background: radial-gradient(ellipse at bottom, var(--nebula-light) 0%, var(--nebula-dark) 40%, var(--void-bg) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: flex-start; /* 讓長內容在小螢幕能正常滾動 */
            justify-content: center;
            padding: 30px 15px;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* ===== 星空粒子系統 ===== */
        #star-container {
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%; 
            z-index: 0;
            pointer-events: none;
            transition: transform 0.1s ease-out; 
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 12px var(--starlight);
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff, 0 0 20px #ffd700; }
        }

        /* ===== MAIN LAYOUT ===== */
        .main-layout {
            display: flex;
            gap: 40px;
            max-width: 1400px;
            width: 100%;
            align-items: stretch;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-origin: center center;
            z-index: 10;
        }

        /* ===== FLOATING BUTTONS ===== */
        .floating-fit-btn, .audio-toggle-btn, .share-blessing-btn {
            position: fixed;
            top: 25px;
            z-index: 1000;
            background: rgba(15, 16, 38, 0.6);
            backdrop-filter: blur(10px);
            color: #ffd700;
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 12px 24px;
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,215,0,0.1);
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }
        .floating-fit-btn { right: 25px; }
        .audio-toggle-btn { right: 180px; }
        .share-blessing-btn { right: 335px; }
        .floating-fit-btn:hover, .audio-toggle-btn:hover, .share-blessing-btn:hover {
            background: rgba(28, 31, 74, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255,215,0,0.6);
            text-shadow: 0 0 8px #ffd700;
        }

        /* ===== LEFT PANEL ===== */
        .left-panel {
            width: 380px; min-width: 380px;
            max-height: calc(100vh - 60px); /* 確保面板不會超出螢幕可視範圍 */
            background: #0d0a14; /* 沉穩深色底 */
            border-radius: 20px; 
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; position: relative;
            animation: slideInLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); filter: blur(10px); }
            to { opacity: 1; transform: translateX(0); filter: blur(0); }
        }

        .panel-title {
            font-size: 1.6rem;
            color: var(--divine-gold);
            text-align: center;
            letter-spacing: 6px;
            margin-bottom: 12px;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(238, 221, 153, 0.3);
        }
        
        .panel-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .settings-body {
            flex: 1; overflow-y: auto; padding-right: 5px;
            scrollbar-width: thin; scrollbar-color: var(--text-muted) transparent;
        }
        .settings-body::-webkit-scrollbar { width: 4px; }
        .settings-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .section-label { 
            color: var(--blue-accent); 
            font-size: 0.95rem; 
            font-weight: 600; 
            letter-spacing: 2px; 
            margin-bottom: 15px; 
        }

        /* 深色下拉式選單 */
        .input-row { display: flex; gap: 8px; margin-bottom: 25px; }
        .custom-select {
            width: 100%; padding: 14px 15px; 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 8px;
            background: #08060a; 
            color: var(--text-main); 
            font-size: 0.95rem; font-family: inherit;
            transition: all 0.3s;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2364b5f6" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position-x: 95%;
            background-position-y: 50%;
            cursor: pointer;
        }
        .custom-select:focus { outline: none; border-color: var(--blue-accent); box-shadow: 0 0 10px rgba(100, 181, 246, 0.2); }
        .custom-select option { background: #0d0a14; color: var(--text-main); }

        /* 注入心念能量按鈕 (手動引導) */
        .btn-add {
            width: 100%; padding: 15px;
            background: linear-gradient(180deg, #2a1f1a, #1a100c);
            color: var(--divine-gold); 
            border: 1px solid rgba(238, 221, 153, 0.3); 
            border-radius: 12px;
            font-weight: 600; font-size: 1rem; cursor: pointer; font-family: inherit; letter-spacing: 3px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: all 0.3s; margin-bottom: 20px;
        }
        .btn-add:active { transform: translateY(2px); }
        .btn-add:hover { filter: brightness(1.2); box-shadow: 0 0 20px var(--divine-gold-glow); }

        /* 隨機自動導航按鈕 */
        .btn-random {
            width: 100%; padding: 15px;
            background: transparent;
            color: var(--blue-accent);
            border: 1px dashed rgba(100, 181, 246, 0.4);
            border-radius: 12px;
            font-weight: 600; font-size: 1rem; cursor: pointer; font-family: inherit; letter-spacing: 2px;
            transition: all 0.3s; margin-bottom: 40px;
        }
        .btn-random:active { transform: translateY(2px); }
        .btn-random:hover { background: rgba(100, 181, 246, 0.1); border-color: var(--blue-accent); box-shadow: 0 0 15px rgba(100, 181, 246, 0.2); }

        /* 輔助控制按鈕 */
        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-ctrl {
            flex: 1; padding: 10px 0; 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 8px;
            font-weight: 600; font-size: 0.8rem; cursor: pointer; font-family: inherit; letter-spacing: 1px; 
            transition: all 0.3s;
            background: #14111d; color: var(--text-muted);
        }
        .btn-ctrl:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-ctrl:active { transform: translateY(1px); }

        /* 法相典籍與介紹清單 (手風琴選單) */
        .list-header-text {
            font-size: 0.85rem; color: var(--text-muted);
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 10px; margin-bottom: 15px; letter-spacing: 2px;
        }

        /* 限制清單區塊高度，並加入獨立專屬卷軸 */
        #itemList {
            max-height: 280px; /* 大幅縮短縱向長度 */
            overflow-y: auto;  /* 內容過長時啟動捲動機制 */
            padding-right: 8px; /* 預留空間，避免文字與卷軸貼齊 */
            scrollbar-width: thin; 
            scrollbar-color: rgba(100, 181, 246, 0.4) transparent;
        }
        #itemList::-webkit-scrollbar { width: 4px; }
        #itemList::-webkit-scrollbar-thumb { background: rgba(100, 181, 246, 0.4); border-radius: 4px; }

        .item-entry {
            display: flex; flex-direction: column; padding: 14px 15px; margin-bottom: 12px;
            background: #14111d; border-radius: 10px;
            border: 1px dashed rgba(255,255,255,0.08);
            transition: all 0.3s ease;
        }
        .item-entry:hover { border-color: rgba(255,255,255,0.2); background: #1a1625; }
        
        /* 選單標題區 */
        .item-header {
            display: flex; align-items: center; gap: 12px; width: 100%; cursor: pointer;
        }
        .item-icon { font-size: 1.4rem; width: 30px; text-align: center; }
        .item-details { flex: 1; display: flex; align-items: center; justify-content: space-between; }
        .item-name-text { color: var(--text-main); font-size: 0.95rem; font-weight: 600; letter-spacing: 2px; }
        
        /* 展開圖示 */
        .expand-icon {
            color: var(--text-muted); font-size: 0.8rem; transition: transform 0.3s;
        }
        .item-entry.expanded .expand-icon { transform: rotate(180deg); color: var(--divine-gold); }

        /* 介紹內文 (預設隱藏，點擊展開) */
        .item-desc {
            display: none;
            font-size: 0.85rem;
            color: #b0b4c9;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            line-height: 1.6;
            letter-spacing: 1px;
            animation: fadeInDesc 0.3s ease-in-out;
        }
        .item-entry.expanded .item-desc { display: block; }
        .item-entry.expanded { border-color: rgba(238, 221, 153, 0.4); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        @keyframes fadeInDesc {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RIGHT PANEL (Cosmic Shrine) ===== */
        .right-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

        .shrine-halo {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(28, 31, 74, 0.8) 0%, transparent 70%);
            border-radius: 50%; z-index: 0; pointer-events: none;
            animation: pulseHalo 8s infinite alternate ease-in-out;
        }
        @keyframes pulseHalo { 0% { transform: scale(0.9); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 1; } }

        .game-cabinet {
            width: 100%; max-width: 550px;
            background: rgba(10, 12, 25, 0.6);
            backdrop-filter: blur(25px);
            border-radius: 40px; padding: 35px 25px; position: relative;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 30px 80px rgba(0,0,0,0.9), inset 0 0 40px rgba(255, 215, 0, 0.05);
            display: flex; flex-direction: column; align-items: center;
            z-index: 1;
            transition: all 0.5s ease;
        }
        .game-cabinet.charging {
            box-shadow: 0 0 80px rgba(255,215,0,0.6), inset 0 0 60px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 215, 0, 0.8);
            transform: translateY(-5px);
        }

        .game-title-area { text-align: center; margin-bottom: 30px; width: 100%; }
        .game-title-area h1 { 
            font-size: 2.2rem; font-weight: 900; 
            color: transparent; 
            background: linear-gradient(180deg, #fff, #ffd700);
            -webkit-background-clip: text; 
            letter-spacing: 6px; 
            text-shadow: 0 0 20px rgba(255,215,0,0.6);
            animation: textGlow 3s infinite alternate;
        }
        @keyframes textGlow { from { text-shadow: 0 0 10px rgba(255,215,0,0.4); } to { text-shadow: 0 0 30px rgba(255,215,0,0.8); } }
        
        .game-title-area .title-sub { 
            font-size: 0.95rem; color: var(--starlight); margin-top: 8px; 
            font-weight: 600; letter-spacing: 5px; opacity: 0.8;
        }

        .gashapon-machine { width: 100%; max-width: 420px; position: relative; display: flex; flex-direction: column; align-items: center; }

        .gashapon-dome {
            width: 90%; aspect-ratio: 1;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05) 0%, rgba(28, 31, 74, 0.4) 60%, rgba(0,0,0,0.8) 100%);
            border-radius: 50%;
            border: 2px solid rgba(255,215,0,0.3);
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 50px rgba(255, 215, 0, 0.2);
            position: relative; overflow: hidden; z-index: 5;
            backdrop-filter: blur(4px);
        }
        .gashapon-dome::after {
            content:''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; box-shadow: inset 0 20px 50px rgba(255,255,255,0.2); pointer-events: none;
        }
        
        .dome-reflection {
            position: absolute; top: 10%; right: 15%; width: 30%; height: 15%;
            background: linear-gradient(135deg, rgba(255,255,255,0.6), transparent); 
            border-radius: 50%; transform: rotate(-30deg);
            filter: blur(4px); z-index: 10; pointer-events: none;
        }

        .capsule-container { width: 100%; height: 100%; position: relative; }
        
        .capsule {
            position: absolute; width: 48px; height: 48px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff 0%, var(--c1) 30%, var(--c2) 80%, #000 100%);
            box-shadow: 0 0 15px var(--c1), inset -5px -5px 10px rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
            animation: floatInside 4s infinite alternate ease-in-out;
        }
        @keyframes floatInside {
            0% { transform: translateY(0) scale(1); box-shadow: 0 0 10px var(--c1); }
            100% { transform: translateY(-5px) scale(1.05); box-shadow: 0 0 25px var(--c1); }
        }

        .machine-body {
            width: 100%; height: 140px;
            background: linear-gradient(180deg, #1c1f4a, #0a0c1a);
            margin-top: -40px; padding-top: 50px;
            border-radius: 15px 15px 40px 40px;
            border: 1px solid rgba(255,215,0,0.2); border-top: none;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding-bottom: 20px; z-index: 4;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 5px 20px rgba(255,215,0,0.1);
            position: relative;
        }

        .control-panel { display: flex; align-items: center; justify-content: center; gap: 40px; width: 100%; padding: 0 20px; }

        .handle-base {
            width: 70px; height: 70px;
            background: radial-gradient(circle at 50% 50%, #2a2d64, #0a0c1a);
            border-radius: 50%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.3), inset 0 0 15px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        
        .handle-base.standby { animation: breatheHalo 3s infinite ease-in-out; }
        @keyframes breatheHalo {
            0%, 100% { box-shadow: 0 0 15px rgba(255,215,0,0.2), inset 0 0 15px rgba(0,0,0,0.8); border-color: rgba(255,215,0,0.5); }
            50% { box-shadow: 0 0 35px rgba(255,215,0,0.6), inset 0 0 15px rgba(0,0,0,0.8); border-color: #ffd700; }
        }
        .handle-hint {
            position: absolute; bottom: -35px; left: 50%; transform: translateX(-50%);
            white-space: nowrap; color: #ffd700; font-size: 0.85rem; font-weight: 600;
            letter-spacing: 2px; text-shadow: 0 0 8px rgba(255,215,0,0.6);
            animation: blinkHint 1.5s infinite; pointer-events: none; transition: opacity 0.3s;
        }
        .handle-base:not(.standby) .handle-hint { opacity: 0; }

        .handle-base::before {
            content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(255,215,0,0.8), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .handle-base:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,215,0,0.6); }
        .handle-base:hover::before { opacity: 1; animation: rotateConic 2s linear infinite; }
        .handle-base:active { transform: scale(0.9); box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        @keyframes rotateConic { 100% { transform: rotate(360deg); } }
        
        .handle-knob {
            width: 12px; height: 45px; background: linear-gradient(180deg, #fff, #ffd700);
            border-radius: 6px; position: absolute; z-index: 2;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .prize-exit {
            width: 100px; height: 45px; background: #000;
            border-radius: 10px 10px 30px 30px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.9), 0 2px 5px rgba(255,215,0,0.2);
            position: absolute; bottom: 15px; display: flex; align-items: center; justify-content: center;
            overflow: visible; border: 1px solid rgba(255,215,0,0.1);
        }

        .machine-info {
            margin-top: 25px; color: var(--starlight);
            font-family: inherit; font-weight: 600; font-size: 0.95rem;
            display: flex; gap: 20px; letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        /* ===== 靈珠降臨層 ===== */
        .dispensed-area {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50; background: rgba(3, 3, 8, 0.7); backdrop-filter: blur(10px);
            border-radius: 40px; display: none; flex-direction: column; align-items: center; justify-content: center;
            animation: fadeInVoid 0.5s ease-out;
        }
        @keyframes fadeInVoid { from { opacity: 0; background: transparent; } to { opacity: 1; } }

        .big-capsule {
            width: 180px; height: 180px; position: relative; cursor: pointer; border-radius: 50%;
            box-shadow: 0 0 60px var(--c1), inset -10px -10px 40px rgba(0,0,0,0.5);
            animation: floatOrb 3s ease-in-out infinite, dropOrb 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: all 0.3s;
        }
        
        .big-capsule::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid var(--c1);
            pointer-events: none; z-index: -1; animation: rippleEffect 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }
        @keyframes rippleEffect {
            0% { width: 100%; height: 100%; opacity: 0.8; border-width: 4px; box-shadow: 0 0 10px var(--c1); }
            100% { width: 220%; height: 220%; opacity: 0; border-width: 0px; box-shadow: 0 0 30px var(--c1); }
        }

        .big-capsule::after {
            content:''; position: absolute; top:-20%; left:-20%; width:140%; height:140%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%);
            border-radius: 50%; pointer-events: none; animation: pulseHalo 2s infinite alternate;
        }
        .big-capsule:hover { transform: scale(1.1); filter: brightness(1.2); box-shadow: 0 0 100px var(--c1); }
        .big-capsule:active { transform: scale(0.9); }

        @keyframes dropOrb {
            0% { transform: scale(0) translateY(-100px); opacity: 0; filter: brightness(3); }
            60% { transform: scale(1.1) translateY(10px); opacity: 1; }
            100% { transform: scale(1) translateY(0); filter: brightness(1); }
        }
        @keyframes floatOrb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .capsule-top {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, var(--c1) 40%, var(--c2) 80%, #000 100%);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .capsule-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 5; font-size: 3.5rem; color: #fff; user-select: none; pointer-events: none; 
            text-shadow: 0 0 20px var(--c2); animation: pulseText 2s infinite alternate;
        }
        .hint-text {
            position: absolute; bottom: -60px; left: 0; width: 100%; text-align: center; 
            color: #ffd700; font-weight: 600; font-size: 1.1rem; letter-spacing: 4px; 
            text-shadow: 0 0 10px rgba(255,215,0,0.6); animation: blinkHint 1.5s infinite;
        }
        @keyframes blinkHint { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; text-shadow: 0 0 20px #ffd700; } }

        .rotating-handle { animation: rotateHandle 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes rotateHandle { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
        .shaking .capsule {
            animation: capsuleBounce var(--jump-speed, 0.06s) steps(1) infinite;
        }
        @keyframes capsuleBounce {
            0% { transform: translate(var(--jx1), var(--jy1)); }
            14% { transform: translate(var(--jx2), var(--jy2)); }
            28% { transform: translate(var(--jx3), var(--jy3)); }
            42% { transform: translate(var(--jx4), var(--jy4)); }
            56% { transform: translate(var(--jx5), var(--jy5)); }
            70% { transform: translate(var(--jx6), var(--jy6)); }
            84% { transform: translate(var(--jx7), var(--jy7)); }
        }

        .dropped-capsule {

</head>

// 在此硬編碼 (Hardcode) 每尊觀音對應的機率與圖示資訊
const items = [

function initParallax() {
    const starContainer = document.getElementById('star-container');
    document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 40;
        const y = (window.innerHeight / 2 - e.pageY) / 40;
        starContainer.style.transform = `translate(${x}px, ${y}px)`;
    });

    if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma !== null && e.beta !== null) {
                const x = e.gamma * -1; 
                const y = (e.beta - 45) * -1; 
                const clampedX = Math.max(-30, Math.min(30, x));
                const clampedY = Math.max(-30, Math.min(30, y));
                starContainer.style.transform = `translate(${clampedX}px, ${clampedY}px)`;
            }
        });
    }
}

let audioCtx = null;
function getAudioCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }

function playChargeSound() {
    if (!isAudioEnabled) return; 
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; 
        osc.frequency.setValueAtTime(50, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 1.2);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 1.2);
    } catch(e) {}
}

function playDropSound() {
    if (!isAudioEnabled) return; 
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(2000, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}

function playOpenSound() {
    if (!isAudioEnabled) return; 
    try {
        const ctx = getAudioCtx();
        [400, 600, 800].forEach((freq, i) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(freq + 200, ctx.currentTime + 1);
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 0.2);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 1.5);
        });
    } catch(e) {}
}

// 接收一個選填參數 forcedPrize，若有值則直接指定結果
function spinGashapon(forcedPrize = null) {
    if(isSpinning || items.length === 0) return;

    if (navigator.vibrate) navigator.vibrate(50);

    isSpinning = true;
    const handle = document.getElementById('handle');
    const container = document.getElementById('capsuleContainer');
    const cabinet = document.getElementById('gameCabinet');
    const status = document.getElementById('machineStatus');

    status.textContent = "匯聚星能...";
    handle.classList.remove('standby');
    handle.classList.add('rotating-handle');
    container.classList.add('shaking');
    cabinet.classList.add('charging'); 
    
    playChargeSound();

    setTimeout(() => {
        handle.classList.remove('rotating-handle');
        container.classList.remove('shaking');
        cabinet.classList.remove('charging');
        
        // 若指定法相則使用指定的，否則執行隨機抽籤
        const prize = forcedPrize || pickWinner();
        dropPrize(prize);
    }, 1200);
}

function pickWinner() {
    let rand = Math.random() * 100;
    let sum = 0;
    const totalP = items.reduce((a,b) => a + b.prob, 0);
    for(let item of items) {
        sum += item.prob;
        if(rand <= (sum / totalP * 100)) return item;
    }
    return items[items.length-1];
}

    // 點擊背景關閉彈窗
    document.getElementById('blessingPopup').addEventListener('click', (e) => {
        if (e.target.id === 'blessingPopup') {
            document.getElementById('blessingPopup').classList.remove('show');
        }
    });

};
</script>
</body>
</html>
